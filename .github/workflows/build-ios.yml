name: Build iOS IPA

# Builds an unsigned iOS IPA on a macOS cloud runner (free for public repos).
# Download the artifact from the Actions run, then sign it with Sideloadly on your
# Windows PC (see README "Install on your iPhone").

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project (generates ios/ incl. share extension + pods)
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Select Xcode 26.2
        run: |
          set -e
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE=$(ls -d /Applications/Xcode_26.2*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1 || true)
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Patch expo-modules-jsi for Swift 5 mode (manifest + regex flag + build script)
        run: |
          set -e
          # The pristine manifest declares swiftLanguageModes: [.v6], so the
          # nested SwiftPM build compiles ExpoModulesJSI with -swift-version 6,
          # where strict "sending" checks reject the package's closures
          # ("risks causing data races", exit 65). Expo builds this package in
          # Swift 5 mode upstream — pin it back and fix the two v5-mode gaps.
          PKG=node_modules/expo-modules-jsi/apple/Package.swift
          # 1) Primary lever: Swift 5 language mode (proved to compile the whole
          #    package in run 78375d0 once upcoming features are dropped).
          sed -i.bak 's/swiftLanguageModes: \[.v6\],/swiftLanguageModes: [.v5],/' "$PKG"
          rm -f "$PKG.bak"
          # 2) Drop upcoming features: NonisolatedNonsendingByDefault turns on
          #    the data-race checks even in v5 mode; InferIsolatedConformances
          #    infers @JavaScriptActor isolation for LongLivedObject conformances,
          #    breaking stored-property default initializers.
          sed -i.bak '/enableUpcomingFeature("NonisolatedNonsendingByDefault")/d; /enableUpcomingFeature("InferIsolatedConformances")/d' "$PKG"
          rm -f "$PKG.bak"
          # 3) In v5 mode the package's single bare-slash regex literal no longer
          #    parses ('$' is not a valid digit). App targets get
          #    -enable-bare-slash-regex automatically; SPM targets must pass it.
          perl -0pi -e 's/(\.unsafeFlags\(swiftIncludeFlags\),\n)/$1        .unsafeFlags(["-enable-bare-slash-regex"]),\n/' "$PKG"
          grep -n "swiftLanguageModes\|bare-slash" "$PKG"
          if grep -q "\.v6" "$PKG"; then echo "ERROR: .v6 still present in Package.swift"; exit 1; fi
          # 4) Belt & braces: force SWIFT_VERSION=5.0 in the nested
          #    build-xcframework.sh xcodebuild invocation as well.
          SCRIPT=node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh
          # (plain mid-line substitution: no backslash/newline escaping issues)
          sed -i.bak 's/SWIFT_COMPILATION_MODE=wholemodule/SWIFT_VERSION=5.0 SWIFT_COMPILATION_MODE=wholemodule/' "$SCRIPT"
          rm -f "$SCRIPT.bak"
          grep -n "SWIFT_VERSION" "$SCRIPT"
          # 5) Strip SWIFT_RETURNS_RETAINED ctor annotations from the C++ header
          #    (the Swift 6.2 importer rejects them in this configuration).
          FILE=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          sed -i.bak -E 's/[[:space:]]*SWIFT_RETURNS_(RETAINED|UNRETAINED) RuntimeScheduler/ RuntimeScheduler/g' "$FILE"
          rm -f "$FILE.bak"
          echo "expo-modules-jsi patched for Swift 5 mode"

      - name: Install CocoaPods (if Podfile present)
        working-directory: ios
        run: |
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile — SPM-based project, skipping pod install"
          fi

      - name: Build unsigned IPA (archive + zip without signing)
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | grep -v Pods | head -1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(ls -d *.xcodeproj | head -1)
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          SCHEME="${SCHEME%.xcodeproj}"
          echo "Using workspace: $WORKSPACE — scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/app.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
                    SWIFT_VERSION=5.0
          mkdir -p build/Payload
          cp -R "build/app.xcarchive/Products/Applications/$SCHEME.app" build/Payload/
          cd build
          zip -qry cute-unsigned.ipa Payload
          ls -la cute-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cute-manager-unsigned-ipa
          path: ios/build/cute-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
