name: Build iOS IPA

# Builds an unsigned iOS IPA on a macOS cloud runner (free for public repos).
# Download the artifact from the Actions run, then sign it with Sideloadly on your
# Windows PC (see README "Install on your iPhone").

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project (generates ios/ incl. share extension + pods)
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Select Xcode 26.2 (Swift 6.2.1 — matches Expo SDK 57 prebuilts)
        run: |
          set -e
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE=$(ls -d /Applications/Xcode_26.2*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | head -1 || true)
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Patch expo-modules-jsi Swift settings (SwiftPM emits .v6 despite swiftLanguageModes)
        run: |
          set -e
          # The nested SPM build emits -swift-version 6 with
          # NonisolatedNonsendingByDefault regardless of swiftLanguageModes,
          # and the toolchain then rejects the header's SWIFT_RETURNS_RETAINED
          # constructor annotations. Force Swift 5 mode + drop the annotations.
          PKG=node_modules/expo-modules-jsi/apple/Package.swift
          sed -i.bak -e 's/swiftLanguageModes: \[.v6\],/swiftLanguageModes: [.v5],/' \
                     -e 's/swiftLanguageModes: \[.v6/\n swiftLanguageModes: [.v5/' \
                     -e 's/\.v6\]/.v5]/g' "$PKG"
          grep -n "swiftLanguageModes" "$PKG"
          # Belt & braces: force language mode via xcodebuild setting later too.
          FILE=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          sed -i.bak -E 's/[[:space:]]*SWIFT_RETURNS_(RETAINED|UNRETAINED) RuntimeScheduler/ RuntimeScheduler/g' "$FILE"
          rm -f "$FILE.bak"
          echo "header annotations removed"

      - name: Install CocoaPods (if Podfile present)
        working-directory: ios
        run: |
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile — SPM-based project, skipping pod install"
          fi

      - name: Build unsigned IPA (archive + zip without signing)
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | grep -v Pods | head -1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(ls -d *.xcodeproj | head -1)
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          SCHEME="${SCHEME%.xcodeproj}"
          echo "Using workspace: $WORKSPACE — scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/app.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
                    SWIFT_VERSION=5.0
          mkdir -p build/Payload
          cp -R "build/app.xcarchive/Products/Applications/$SCHEME.app" build/Payload/
          cd build
          zip -qry cute-unsigned.ipa Payload
          ls -la cute-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cute-manager-unsigned-ipa
          path: ios/build/cute-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
