name: Build iOS IPA

# Builds an unsigned iOS IPA on a macOS cloud runner (free for public repos).
# Download the artifact from the Actions run, then sign it with Sideloadly on your
# Windows PC (see README "Install on your iPhone").

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project (generates ios/ incl. share extension)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve packages
        working-directory: ios
        run: xcodebuild -resolvePackageDependencies

      - name: Build unsigned IPA (archive + export without signing)
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace cute.xcworkspace \
            -scheme cute \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/cute.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES
          mkdir -p build/Payload
          cp -R build/cute.xcarchive/Products/Applications/cute.app build/Payload/
          cd build
          zip -qry cute-unsigned.ipa Payload
          ls -la cute-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cute-manager-unsigned-ipa
          path: ios/build/cute-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
