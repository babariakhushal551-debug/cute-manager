name: Build iOS IPA

# Builds an unsigned iOS IPA on a macOS cloud runner (free for public repos).
# Download the artifact from the Actions run, then sign it with Sideloadly on your
# Windows PC (see README "Install on your iPhone").

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project (generates ios/ incl. share extension + pods)
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Select newest Xcode (26.x required — Swift 6.2 packages)
        run: |
          set -e
          echo "Available Xcodes:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          X26=$(ls -d /Applications/Xcode*26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X26" ]; then
            echo "Selecting $X26"
            sudo xcode-select -s "$X26/Contents/Developer"
          else
            echo "No Xcode 26 found — using default"
          fi
          xcodebuild -version
          swift --version

      - name: Patch expo-modules-jsi for Xcode 26.3 (Swift 6.2.4)
        run: |
          set -e
          # Swift 6.2.4's Clang importer rejects SWIFT_RETURNS_RETAINED on
          # constructors declared before the class's SWIFT_SHARED_REFERENCE
          # attribute. The annotations are semantically redundant there
          # (constructors of shared-reference classes always return +1), so
          # removing them is safe and unblocks compilation.
          FILE=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          sed -i.bak -E 's/[[:space:]]*SWIFT_RETURNS_(RETAINED|UNRETAINED) RuntimeScheduler/ RuntimeScheduler/g' "$FILE"
          rm -f "$FILE.bak"
          grep -c "SWIFT_RETURNS_RETAINED" "$FILE" || echo "header patched OK"
          # Xcode 26.3 ships Swift 6.2.4, where NonisolatedNonsendingByDefault
          # starts flagging expo's nonisolated(unsafe) pointer captures as
          # data races. The code was written for 6.2.1 — disable the feature.
          PKG=node_modules/expo-modules-jsi/apple/Package.swift
          sed -i.bak '/NonisolatedNonsendingByDefault/d' "$PKG"
          rm -f "$PKG.bak"
          grep -c "NonisolatedNonsendingByDefault" "$PKG" || echo "package patched OK"

      - name: Install CocoaPods (if Podfile present)
        working-directory: ios
        run: |
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile — SPM-based project, skipping pod install"
          fi

      - name: Build unsigned IPA (archive + zip without signing)
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | grep -v Pods | head -1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(ls -d *.xcodeproj | head -1)
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          SCHEME="${SCHEME%.xcodeproj}"
          echo "Using workspace: $WORKSPACE — scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/app.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p build/Payload
          cp -R "build/app.xcarchive/Products/Applications/$SCHEME.app" build/Payload/
          cd build
          zip -qry cute-unsigned.ipa Payload
          ls -la cute-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cute-manager-unsigned-ipa
          path: ios/build/cute-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
