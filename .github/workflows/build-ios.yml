name: Build iOS IPA

# Builds an unsigned iOS IPA on a macOS cloud runner (free for public repos).
# Download the artifact from the Actions run, then sign it with Sideloadly on your
# Windows PC (see README "Install on your iPhone").

on:
  workflow_dispatch: {}
  push:
    branches: [master, main]
    paths-ignore:
      - "**.md"

jobs:
  build:
    # macOS 26 image: Expo SDK 57 requires Xcode 26.4+ (older toolchains reject
    # expo-modules-jsi's Swift source; see expo/expo#47819).
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project (generates ios/ incl. share extension + pods)
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Select Xcode 26.4.1 (minimum required by Expo SDK 57)
        run: |
          set -e
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE=$(ls -d /Applications/Xcode_26.4*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Install CocoaPods (if Podfile present)
        working-directory: ios
        run: |
          if [ -f Podfile ]; then
            pod install
          else
            echo "No Podfile — SPM-based project, skipping pod install"
          fi

      - name: Build unsigned IPA (archive + zip without signing)
        working-directory: ios
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | grep -v Pods | head -1)
          if [ -z "$WORKSPACE" ]; then
            WORKSPACE=$(ls -d *.xcodeproj | head -1)
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          SCHEME="${SCHEME%.xcodeproj}"
          echo "Using workspace: $WORKSPACE — scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/app.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
                    SWIFT_VERSION=5.0
          mkdir -p build/Payload
          cp -R "build/app.xcarchive/Products/Applications/$SCHEME.app" build/Payload/
          cd build
          zip -qry cute-unsigned.ipa Payload
          ls -la cute-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cute-manager-unsigned-ipa
          path: ios/build/cute-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
